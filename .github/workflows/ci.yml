name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pandas scikit-learn

      - name: Run Ruff
        run: ruff check scripts/ tests/

  test:
    name: test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas scikit-learn

      - name: Data validation
        run: |
          python scripts/01_data_validation.py

      - name: Data tests
        run: |
          pytest tests/test_data.py --junitxml=data-test-results.xml

      - name: Model quality gate
        run: |
          pytest tests/test_model.py --junitxml=model-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            data-test-results.xml
            model-test-results.xml